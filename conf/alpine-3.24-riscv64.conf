# Alpine 3.24 riscv64.
#
# Unlike the x86_64/aarch64 confs next to this one, riscv64 does NOT use a
# cloud image: Alpine publishes cloud qcow2 images for x86_64 and aarch64
# only (checked on 3.23 and 3.24). riscv64 is otherwise a first-class Alpine
# arch -- the release tree exists and BOTH package repositories are built
# for it, which is what makes a full sync story possible here:
#
#     main/riscv64/APKINDEX.tar.gz         HTTP 200
#     community/riscv64/APKINDEX.tar.gz    HTTP 200
#
# So this conf installs from the standard installer ISO, driven over the
# serial console by hooks/host_installOpts.py.
#
# WHY THE ISO AND NOT alpine-uboot-<ver>-riscv64.tar.gz. The tarball route
# was built first and does produce a working image, but that image cannot be
# RUN by anyvm, which is the whole point of building it. Measured on the
# image the tarball route produced:
#
#   host u-boot (anyvm's fallback)  "Failed to reserve memory for fdt /
#                                    FDT creation failed! hanging..."
#   edk2 UEFI   (anyvm's preference) drops to the EFI Shell -- no ESP
#   Alpine's bundled u-boot          boots, but it is a BUILD artifact
#                                    extracted from the tarball and is not
#                                    published with the image
#
# The tarball's live system boots via u-boot + extlinux, so setup-disk sees
# no /sys/firmware/efi and installs a BIOS-style layout with no ESP. The ISO
# boots through u-boot's own EFI loader instead, efivarfs is mounted, and
# setup-disk then installs grub-efi onto an ESP (grub-efi is packaged for
# riscv64 in 3.24). That is the same shape ubuntu's 24.04/26.04 riscv64
# images have, and it is what makes the host's u-boot boot the result: the
# EFI path never runs the extlinux code the LMB regression broke.
#
# Verified locally on 2026-09-01 against 3.24.1, all four separately:
#   ISO under edk2 UEFI                     -> login prompt, efivarfs mounted
#   ISO under the HOST u-boot, as a virtio
#     disk (what this build does)           -> login prompt, efivarfs mounted
#   ISO under the HOST u-boot, as a
#     usb-storage cdrom (build.py's normal
#     ISO path)                             -> "Device 0: unknown device",
#                                              falls through to TFTP and drops
#                                              to the u-boot prompt
#   the tarball-built image, all three
#     firmwares                             -> as tabulated above
#
# That third line is why hooks/host_beforeBuild.sh places the ISO at
# build/<os>.img rather than letting createVM() download it as <os>.iso:
# u-boot's USB storage driver handles direct-access devices, not the
# CD-ROM/MMC profile, so an ISO on usb-storage is invisible to it. Named
# .img, createVM() attaches it with if=virtio, which u-boot scans happily.
VM_ISO_LINK="https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/riscv64/alpine-standard-3.24.1-riscv64.iso"

VM_OS_NAME="alpine"
VM_RELEASE=3.24
VM_ARCH=riscv64
VM_SSH_PORT=2222

VM_ROOT_PASSWORD=anyvm.org
VM_LOGIN_TAG="login:"
VM_SHUTDOWN_CMD="poweroff"

VM_INSTALL_CMD="apk add --no-cache "
VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-utils"
VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

# No VM_UBOOT. build.py's default -- the host's
# /usr/lib/u-boot/qemu-riscv64_smode/uboot.elf -- boots this ISO through its
# EFI loader, and the installed image the same way. Pinning a u-boot here
# would only re-introduce a build-time file that cannot be shipped to anyvm.

VM_NIC=virtio
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# riscv64 has no KVM here, so everything runs under TCG emulation. These are
# crash backstops with real headroom, not budgets: a loaded CI runner is
# slower than the workstation these were measured on.
VM_SSH_READY_TIMEOUT=180
VM_LOGIN_MAX_SECONDS=900

# Full set, and that is measured rather than copied from the sibling confs:
# rsync, sshfs and mount.nfs were all installed and present in a live guest.
# NOTE: build.py does not read VM_SYNC_METHODS, so a green build here is not
# evidence for these -- anyvm's testrun.yml is the only oracle.
VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
