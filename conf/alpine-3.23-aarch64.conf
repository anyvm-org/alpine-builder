

# See conf/alpine-3.24.conf for the patch-pinning and variant rationale.
VM_VHD_LINK="https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/cloud/generic_alpine-3.23.5-aarch64-uefi-cloudinit-r0.qcow2"
VM_OS_NAME="alpine"
VM_SSH_PORT=2222
VM_RELEASE=3.23

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="poweroff"

VM_INSTALL_CMD="apk add --no-cache "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-utils"

VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

VM_ARCH=aarch64
VM_NIC=virtio

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
