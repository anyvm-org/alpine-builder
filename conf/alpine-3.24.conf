

# Alpine's official cloud image.
#
# WHY THE URL PINS A PATCH VERSION (3.24.1) WHILE VM_RELEASE IS THE LINE
# (3.24).  Alpine bakes the full patch version and an image revision into
# the filename and publishes no "latest" alias -- but it KEEPS the older
# patch images in the branch directory (v3.23/releases/cloud/ still carries
# 3.23.0, .2, .3, .4 and .5 side by side). So a pinned patch URL never rots,
# and a patch bump is an in-place edit of this line within the SAME release,
# not a new release tag. That matches how ubuntu-builder treats "24.04".
#
# Variant choice: "cloudinit" (not "tiny", which uses tiny-cloud instead of
# cloud-init) and the non-"metal" image, which is the one built for VMs.
# x86_64 takes the bios image because QEMU boots this guest on SeaBIOS;
# aarch64 has only a uefi image, which is what it needs anyway.
VM_VHD_LINK="https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/generic_alpine-3.24.1-x86_64-bios-cloudinit-r0.qcow2"
VM_OS_NAME="alpine"
VM_SSH_PORT=2222
VM_RELEASE=3.24

VM_ROOT_PASSWORD=anyvm.org

VM_LOGIN_TAG="login:"

VM_SHUTDOWN_CMD="poweroff"

VM_INSTALL_CMD="apk add --no-cache "

VM_RSYNC_PKG="rsync"
VM_SSHFS_PKG="sshfs"

# All four are in Alpine "main" for 3.24 (probed against the branch index),
# so no community repo needs enabling.
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG nfs-utils"

VM_INSTALL_SCRIPT="hooks/vm_installpkgs.sh"

VM_NIC=virtio

# The cloud image has no console password and no SSH key out of the box.
# hooks/host_prepareImage.sh bakes in root SSH access with virt-customize
# before the first boot. Unlike the RHEL-family builders there is no
# --selinux-relabel here: Alpine ships no SELinux policy.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
